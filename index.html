<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hazar &amp; Yousef RSVP</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Karla:wght@400;500;600&display=swap">
<style>
/* Layout: a single narrow column — an invitation card first, the RSVP form directly beneath it. */
:root{
  --bg:#edf1ee; --card:#f8faf8; --ink:#1c2924; --muted:#5d6f68; --line:#cfd8d3;
  --accent:#a8566a; --accent-ink:#ffffff; --soft:#e4cdd3; --ok:#2f7a5a; --warn:#9a6a1e; --bad:#9b3d3d;
  --display:"Bodoni Moda",Didot,"Times New Roman",serif; --body:"Karla","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#131a17; --card:#1b2521; --ink:#eef2ef; --muted:#9fb0a8; --line:#33423c;
  --accent:#d98a9c; --accent-ink:#1b1013; --soft:#3d2a30; --ok:#6fc49a; --warn:#d7a84f; --bad:#e07b7b; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#131a17; --card:#1b2521; --ink:#eef2ef; --muted:#9fb0a8; --line:#33423c;
  --accent:#d98a9c; --accent-ink:#1b1013; --soft:#3d2a30; --ok:#6fc49a; --warn:#d7a84f; --bad:#e07b7b; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 56px}
.wrap{max-width:560px;margin:0 auto;display:grid;gap:22px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;line-height:1.1}
.eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:28px 24px}
.invite{text-align:center;display:grid;gap:14px;position:relative}
.invite::before,.invite::after{content:"";position:absolute;left:12px;right:12px;height:1px;background:var(--line)}
.invite::before{top:12px}.invite::after{bottom:12px}
.names{font-size:clamp(38px,9vw,52px);letter-spacing:.01em}
.names i{font-style:italic;color:var(--accent);font-size:.6em;display:block;margin:4px 0}
.when{display:grid;gap:2px;font-size:17px}
.when b{font-weight:600}
.venue{color:var(--muted)}
.deadline{display:inline-block;justify-self:center;margin-top:4px;padding:4px 12px;border:1px solid var(--accent);color:var(--accent);border-radius:999px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}

.rsvp{display:grid;gap:18px}
.rsvp h2{font-size:26px}
label{display:grid;gap:6px;font-size:14px;font-weight:600}
input[type=tel]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:11px 12px;width:100%;min-width:0}
input:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.row>*{flex:1 1 180px;min-width:0}
button{font:inherit;font-weight:600;border-radius:4px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:11px 16px;cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.ghost{background:transparent}
button:disabled{opacity:.5;cursor:default}
.note{font-size:14px;color:var(--muted);margin:0}
.err{color:var(--bad);font-size:14px;margin:0}
.greet{font-family:var(--display);font-size:24px}
.seats{font-size:15px;color:var(--muted)}
.seats b{color:var(--ink);font-weight:600}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice button{padding:14px}
.choice button[aria-pressed=true]{border-color:var(--accent);background:var(--soft);color:var(--ink)}
.stepper{display:flex;align-items:center;gap:14px;justify-content:center}
.stepper button{width:48px;height:48px;font-size:22px;padding:0;border-radius:50%}
.stepper output{font-family:var(--display);font-size:44px;min-width:64px;text-align:center;font-variant-numeric:tabular-nums}
.hostnum{font-variant-numeric:tabular-nums;font-weight:600}
.done{display:grid;gap:10px;text-align:center}
.done .greet{color:var(--ok)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions>*{flex:1 1 160px}
a.secondary{display:inline-flex;justify-content:center;align-items:center;text-decoration:none;font-weight:600;border-radius:4px;padding:11px 16px;background:var(--card);color:var(--ink);border:1px solid var(--line)}
.foot{text-align:center;font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <section class="card invite" id="invite">
    <p class="eyebrow">Together with their families</p>
    <h1 class="names"><span data-f="name1">Hazar</span><i>&amp;</i><span data-f="name2">Yousef</span></h1>
    <p class="eyebrow">invite you to celebrate their engagement</p>
    <div class="when">
      <b data-f="date">Sunday, 06 December 2026</b>
      <span data-f="time">5:30 PM</span>
      <span class="venue" data-f="venue">Vida Marina Hotel, Dubai</span>
    </div>
    <span class="deadline">Kindly reply by <span data-f="deadline">1 December</span></span>
  </section>

  <section class="card rsvp" id="rsvp" aria-live="polite"></section>

  <p class="foot">Questions? Message <span class="hostnum" data-f="hostDisplay">+971 555 674 429</span> on WhatsApp.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
(function(){
  const sb = supabase.createClient(RSVP_CONFIG.url, RSVP_CONFIG.anonKey, { auth: { persistSession: false } });
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const digits = s => String(s||'').replace(/\D/g,'');
  function fmtHost(d){ d = digits(d); return d ? '+' + d.replace(/(\d{3})(\d{2})(\d{3})(\d{4})$/,'$1 $2 $3 $4') : '—'; }
  let EV = { name1:'Hazar', name2:'Yousef', host_phone:'+971555674429' };
  const couple = () => `${EV.name1} & ${EV.name2}`;

  function fillInvite(){
    for (const el of document.querySelectorAll('[data-f]')) {
      const k = el.dataset.f;
      el.textContent = k==='hostDisplay' ? fmtHost(EV.host_phone) : (EV[k] ?? '');
    }
    document.title = `${couple()} RSVP`;
  }

  // Invitation details live in the database so the host can change them without redeploying
  sb.from('event').select('*').eq('id', 1).maybeSingle().then(({ data }) => { if (data) { EV = data; fillInvite(); } });

  /* ---------- Guest RSVP flow ---------- */
  const rsvp = $('#rsvp');
  let guest = null, phone = '', attending = null, count = 0;

  // Remembers the guest's number and unsent choice on this device, so reopening the page picks up where they left off
  const MEM = 'rsvp-guest-v1';
  function remember(){ try { localStorage.setItem(MEM, JSON.stringify({ phone, attending, count })); } catch {} }
  function forget(){ try { localStorage.removeItem(MEM); } catch {} }
  function recall(){ try { return JSON.parse(localStorage.getItem(MEM)); } catch { return null; } }

  async function findGuest(p, draft){
    const { data, error } = await sb.rpc('lookup_guest', { p_phone: p });
    if (error) return { error: true };
    const g = data && data[0];
    if (!g) return { notFound: true };
    guest = g; phone = p;
    attending = g.status==='attending' ? true : g.status==='declined' ? false : null;
    count = g.coming || g.seats;
    // An unsent choice only applies while the guest hasn't replied yet
    if (draft && g.status==='pending' && draft.attending !== undefined) {
      attending = draft.attending;
      count = Math.min(Math.max(+draft.count||1, 1), g.seats);
    }
    remember();
    return { ok: true };
  }

  function renderLookup(err){
    rsvp.innerHTML = `
      <div><p class="eyebrow">RSVP</p><h2>Find your invitation</h2></div>
      <p class="note">Enter the mobile number your invitation was sent to.</p>
      <form id="lookup">
        <div class="row">
          <label for="phone">Mobile number<input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="050 123 4567" required value="${esc(phone)}"></label>
          <button class="primary" type="submit" id="find">Continue</button>
        </div>
        ${err ? `<p class="err" style="margin-top:10px">${esc(err)}</p>` : ''}
      </form>`;
    $('#lookup').addEventListener('submit', async e => {
      e.preventDefault();
      phone = $('#phone').value;
      $('#find').disabled = true; $('#find').textContent = 'Looking…';
      const r = await findGuest(phone);
      if (r.error) return renderLookup('Something went wrong. Please check your connection and try again.');
      if (r.notFound) return renderLookup(`We couldn't find that number. Try the number your invitation was sent to, or message ${fmtHost(EV.host_phone)}.`);
      guest.status === 'pending' ? renderChoice() : renderDone();
    });
  }

  function renderChoice(err){
    const s = guest.seats;
    rsvp.innerHTML = `
      <div><p class="eyebrow">RSVP</p><p class="greet">Welcome, ${esc(guest.name)}</p>
        <p class="seats">We have reserved <b>${s} ${s===1?'seat':'seats'}</b> for you.</p>
        <p class="note">You can reply once, so please check before sending.</p></div>
      <div class="choice">
        <button id="yes" aria-pressed="${attending===true}">Joyfully accept</button>
        <button id="no" aria-pressed="${attending===false}">Regretfully decline</button>
      </div>
      <div id="seatpick" ${attending===true?'':'hidden'}>
        <p class="note" style="text-align:center;margin-bottom:8px">How many of you will attend?</p>
        <div class="stepper">
          <button id="minus" aria-label="Fewer guests">−</button>
          <output id="cnt">${count}</output>
          <button id="plus" aria-label="More guests">+</button>
        </div>
        <p class="note" style="text-align:center;margin-top:6px">Up to ${s}</p>
      </div>
      ${err ? `<p class="err">${esc(err)}</p>` : ''}
      <div class="actions">
        <button class="ghost" id="back">Not you?</button>
        <button class="primary" id="next" ${attending===null?'disabled':''}>Send my reply</button>
      </div>`;
    const sync = () => { $('#yes').setAttribute('aria-pressed', attending===true); $('#no').setAttribute('aria-pressed', attending===false);
      $('#seatpick').hidden = attending!==true; $('#next').disabled = attending===null; $('#cnt').value = count;
      $('#minus').disabled = count<=1; $('#plus').disabled = count>=s; };
    $('#yes').onclick = () => { attending = true; sync(); remember(); };
    $('#no').onclick = () => { attending = false; sync(); remember(); };
    $('#minus').onclick = () => { count = Math.max(1, count-1); sync(); remember(); };
    $('#plus').onclick = () => { count = Math.min(s, count+1); sync(); remember(); };
    $('#back').onclick = () => { guest=null; phone=''; attending=null; forget(); renderLookup(); };
    $('#next').onclick = submit;
    sync();
  }

  async function submit(){
    const b = $('#next'); b.disabled = true; b.textContent = 'Sending…';
    const { error } = await sb.rpc('submit_rsvp', { p_id: guest.id, p_phone: phone, p_attending: attending, p_coming: attending ? count : 0 });
    if (error && /already replied/.test(error.message || '')) {
      // Answered meanwhile (another device or window): show the reply on record
      const r = await findGuest(phone);
      return r.ok ? renderDone() : renderLookup();
    }
    if (error) return renderChoice('Your reply could not be saved. Please check your connection and try again.');
    guest.status = attending ? 'attending' : 'declined'; guest.coming = attending ? count : 0;
    remember(); renderDone();
  }

  // The reply on record; guests can't resubmit, so changes go to the host on WhatsApp
  function renderDone(){
    const yes = guest.status === 'attending', n = guest.coming;
    const msg = `RSVP for ${couple()}'s engagement\n${guest.name}: I replied "${yes ? `attending, ${n} of ${guest.seats} seats` : 'unable to attend'}" and would like to change it.`;
    const wa = `https://wa.me/${digits(EV.host_phone)}?text=${encodeURIComponent(msg)}`;
    rsvp.innerHTML = `
      <div class="done">
        <p class="eyebrow">Reply received</p>
        <p class="greet">${yes ? `We can't wait to see you${n>1?' all':''}` : `We'll miss you`}</p>
        <p class="note">${esc(guest.name)}, ${yes ? `your ${n} ${n===1?'seat is':'seats are'} confirmed.` : 'your answer has been recorded.'} ${esc(couple())} can see it now.</p>
      </div>
      <p class="note" style="text-align:center">Need to change your reply? Message ${esc(couple())} on WhatsApp.</p>
      <div class="actions">
        <a class="secondary" href="${wa}" target="_blank" rel="noopener">Ask to change my reply</a>
      </div>
      <p class="note" style="text-align:center">Not ${esc(guest.name)}? <button class="ghost" id="notme" style="padding:4px 10px">Use a different number</button></p>`;
    $('#notme').onclick = () => { guest=null; phone=''; attending=null; forget(); renderLookup(); };
  }

  // Returning visitor: reload their invitation with the latest reply from the database
  (async () => {
    const saved = recall();
    if (!saved || !saved.phone) return renderLookup();
    rsvp.innerHTML = `<p class="note">Loading your invitation…</p>`;
    const r = await findGuest(saved.phone, saved);
    if (r.error) { phone = saved.phone; return renderLookup('Something went wrong. Please check your connection and try again.'); }
    if (r.notFound) { forget(); return renderLookup(); }
    guest.status === 'pending' ? renderChoice() : renderDone();
  })();
})();
</script>
</body>
</html>
